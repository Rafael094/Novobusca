# =============================================================================
# IntelliINPI - Production stack (Oracle Cloud Free Tier VM)
#
# Runs ONLY the FastAPI backend. The PostgreSQL instance is the one already
# running on the host VM (no database container here), and the Next.js
# frontend is deployed separately on Vercel.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#
# Secrets are NOT stored in this file: every value comes from ./backend/.env
# (created on the server, never committed). See docs/DEPLOY_ORACLE_VERCEL.md.
# =============================================================================

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        # ingestion/ directory, so the Dockerfile can read its requirements.txt
        # (Docker cannot COPY files outside the primary build context).
        ingestion_reqs: ./ingestion
    image: intelliinpi-api:latest
    container_name: intelliinpi_api
    restart: unless-stopped

    # All configuration/secrets come from the server-only .env file.
    env_file:
      - ./backend/.env

    ports:
      # Bind on all interfaces so the Vercel frontend can reach the API over
      # HTTPS (put a reverse proxy / Caddy in front — see the runbook).
      - "8000:8000"

    volumes:
      # Persistent private document storage (NIT uploads). Must survive
      # container recreation; DOCUMENT_STORAGE_DIR in .env points here.
      - api_documents:/app/var/documents
      # Ingested INPI datasets live under DATA_DIR (mounted read-write so the
      # ingestion pipeline can populate them).
      - api_data:/app/data

    # Talk to the PostgreSQL running natively on the VM host.
    # network_mode: host would be simpler but loses the named volumes, so we
    # map the host through extra_hosts instead (works on Linux/Docker 20.10+).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    # Migrations + índices + seed rodam uma vez antes de o servidor subir; depois
    # uvicorn mantém o processo de longa duração (connection pool) vivo — a razão
    # de este backend não poder ser serverless.
    #
    # `app.db_indexes` é a rede de segurança dos índices: as tabelas do INPI são
    # carregadas em massa FORA do Alembic, então um banco recriado voltava a
    # fazer Seq Scan de 6,6 M de linhas (~76 s por busca). O passo é idempotente
    # (cria só o que falta), roda em ~1 s quando já está tudo no lugar e é
    # tolerante a falha (`|| true`: um índice problemático nunca impede a API de
    # subir — o erro fica no log e é retomado no próximo deploy).
    command: >
      sh -c "alembic upgrade head &&
             { python -m app.db_indexes || true; } &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Worker de PETIÇÕES do pePI (documentos GRU).
  #
  # As petições de um processo não existem nos CSVs de dados abertos: só na
  # aplicação de consulta pePI. Este container faz login ANÔNIMO, lê a página de
  # detalhe de cada marca (por `codigo_interno`) e grava em `marcas_peticoes` /
  # `marcas_pepi_sync`. Fica em container próprio para não competir com a API e
  # não expõe porta nenhuma.
  #
  # Lote em massa por apresentação (Mista/Figurativa — onde há mais processos com
  # imagem): cada ciclo drena a fila `PENDING` (o que alguém abriu na tela), busca
  # um lote, dorme e recomeça. O `ON CONFLICT`/status terminal em
  # `marcas_pepi_sync` garante resume: cada marca é buscada uma vez só.
  #
  # Ajuste o volume com os envs INPI_PEPI_* (ou nas flags do `command`). Para
  # pausar sem derrubar a stack: `docker compose -f docker-compose.prod.yml stop peticoes`.
  # ---------------------------------------------------------------------------
  peticoes:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    image: intelliinpi-peticoes:latest
    container_name: intelliinpi_peticoes
    restart: unless-stopped

    # Só começa depois que a API está saudável: o comando do `api` roda
    # `alembic upgrade head` (que cria `marcas_peticoes`/`marcas_pepi_sync`) e
    # `app.db_indexes` antes do uvicorn. Sem isto o worker pode subir antes de as
    # tabelas existirem e falhar na primeira rodada.
    depends_on:
      api:
        condition: service_healthy

    # Mesmos segredos/URL do backend (DATABASE_URL aponta para o PostgreSQL do
    # host via host.docker.internal — ver extra_hosts).
    env_file:
      - ./backend/.env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      INPI_PEPI_CONCURRENCY: "2"
      INPI_PEPI_DELAY: "0.25"

    volumes:
      # MESMO DATA_DIR da API. Sem isto, rodar `ingestion.logos` por aqui
      # (é o jeito documentado de baixar logotipos — o worker não tem serviço
      # próprio) gravaria a imagem num /app/data efêmero do container: a linha
      # iria para o banco, mas a API — que serve de `api_data` — nunca veria o
      # arquivo e a tela cairia no placeholder.
      - api_data:/app/data

    command: >
      sh -c "while true; do
               python -m ingestion.peticoes
                 --apresentacao Mista --apresentacao Figurativa
                 --limite 2000 --concorrencia 2 --delay 0.25 || true;
               sleep 300;
             done"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Worker da RPI (Revista da Propriedade Industrial) — atualização SEMANAL de
  # marcas, patentes, desenhos industriais e programas de computador.
  #
  # A RPI sai toda terça-feira e traz, por seção, os despachos daquela semana.
  # Os CSVs de dados abertos são snapshots: reprocessá-los toda semana custaria
  # ~11 GB de download + recarga total das tabelas. Este container faz só o DELTA:
  # descobre as edições recentes, baixa o ZIP em /txt/, parseia (XML de Marcas e
  # Desenhos, TXT INID de Patentes, XML de Programas) e grava os despachos novos
  # em `marcas_despachos`/`patentes_despachos`/`desenhos_despachos`/
  # `softwares_despachos`, registrando o estado em `inpi_rpi`.
  #
  # Marcas e Desenhos também baixam as imagens referenciadas no XML (logotipos
  # em `marcas_logos`, figuras em `desenhos_figuras`); as pendentes/falhas são
  # retomadas no ciclo seguinte. Programas de computador só têm metadados.
  #
  # Idempotente em duas camadas: edição já PROCESSED é pulada (nada é baixado) e
  # o INSERT ignora despachos já presentes. O laço é raro e barato. Para pausar
  # sem derrubar a stack:
  # `docker compose -f docker-compose.prod.yml stop rpi`.
  # ---------------------------------------------------------------------------
  rpi:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    image: intelliinpi-rpi:latest
    container_name: intelliinpi_rpi
    restart: unless-stopped

    # Mesma razão do `peticoes`: espera a API terminar `alembic upgrade head` +
    # `app.db_indexes` (que garante os índices únicos usados em ON CONFLICT).
    depends_on:
      api:
        condition: service_healthy

    env_file:
      - ./backend/.env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Mesmo DATA_DIR da API: os ZIPs semanais ficam em data/raw/rpi e podem ser
      # auditados/retomados (raw_path/sha256 são registrados em inpi_rpi).
      - api_data:/app/data

    command: >
      sh -c "while true; do
               python -m ingestion.rpi
                 --secao marcas --secao patentes
                 --secao desenho_industrial --secao software
                 --ultimas 2 --dias 21 || true;
               sleep 21600;
             done"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api_documents:
  api_data:
