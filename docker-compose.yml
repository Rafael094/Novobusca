# =============================================================================
# IntelliINPI - Docker Compose (optional local stack)
#
# Starts PostgreSQL 16, the FastAPI backend and the Next.js frontend.
# The default workflow uses a NATIVE PostgreSQL; this stack is provided as an
# alternative so the whole system can come up with a single command.
#
#   docker compose up -d postgres     # only the database
#   docker compose up -d              # the full stack
#
# NOTE: the database uses a DEDICATED database name (intelliinpi_app) and is
# exposed on host port 5433 to avoid clashing with a native PostgreSQL on 5432.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: intelliinpi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intelliinpi
      POSTGRES_PASSWORD: intelliinpi
      POSTGRES_DB: intelliinpi_app
      # Keep the container's locale aligned with pt-BR data.
      LANG: pt_BR.UTF-8
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Extensions (pg_trgm, unaccent) are created automatically on first init.
      - ./database/01_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliinpi -d intelliinpi_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelliinpi_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://intelliinpi:intelliinpi@postgres:5432/intelliinpi_app
      MASTER_ADMIN_EMAIL: master@intelliinpi.com.br
      MASTER_ADMIN_PASSWORD: ChangeMe_MasterAdmin_123!
      MASTER_ADMIN_NAME: Master Admin
      CORS_ORIGINS: http://localhost:3000
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./ingestion:/app/ingestion:ro
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelliinpi_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
